services:
  api:
    image: maven:3.9-eclipse-temurin-25
    working_dir: /app
    volumes:
      - ./backend:/app
      - ~/.m2:/root/.m2
    command: sh -c "mvn clean flyway:migrate && mvn spring-boot:run"
    environment:
      DB_URL: db:5432/sortcery
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      - db

  db:
    image: postgres:18.1
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: sortcery
    ports:
      - "5432:5432"
    volumes:
      - .db:/var/lib/postgresql

  adminer:
    image: adminer
    ports:
      - "8000:8080"
